<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <link rel="stylesheet" href="css/leaflet.css">
        <link rel="stylesheet" href="css/L.Control.Layers.Tree.css">
        <link rel="stylesheet" href="css/qgis2web.css">
        <link rel="stylesheet" href="css/fontawesome-all.min.css">
        <link rel="stylesheet" href="css/leaflet-search.css">
        <link rel="stylesheet" href="css/leaflet.photon.css">
        <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
        }
        </style>
        <title></title>

        <style>
        #judul-peta {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background-color: rgba(255, 255, 255, 0.9);
            padding: 8px 18px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
            font-family: Arial, sans-serif;
            font-size: 25px;
            font-weight: bold;
            color: #2c3e50;
            text-align: center;
            pointer-events: none;
        }

        .legend {
            background: rgba(255, 255, 255, 0.9);
            padding: 10px 14px;
            font: 12px/16px Arial, Helvetica, sans-serif;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
            border-radius: 6px;
            line-height: 20px;
        }
        .legend i {
            width: 16px;
            height: 16px;
            float: left;
            margin-right: 8px;
            opacity: 0.8;
        }
        /* Menyamakan lebar kotak pencarian dengan kotak detail wilayah */
        .leaflet-control-search {
            width: 270px !important;
        }

        .leaflet-control-search .search-input {
            width: 240px !important; /* Diberi ruang untuk ikon/tombol di sampingnya */
            box-sizing: border-box;
        }

        .leaflet-control-search .search-tip {
            width: 100% !important;  /* Menyesuaikan lebar daftar dropdown saran pencarian */
            box-sizing: border-box;
        }
        .info-box {
            padding: 10px 14px;
            font: 12px/16px Arial, Helvetica, sans-serif;
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            border-radius: 6px;
            min-width: 180px;
            max-width: 250px;           /* MEMBATASI LEBAR KOTAK MAKSIMAL 250px */
            word-wrap: break-word;      /* Memaksa teks panjang turun ke baris baru */
            margin-top: 10px;           /* Memberi jarak dari tombol search di atasnya */
        }
        .info-box h4 {
            margin: 0 0 6px;
            color: #2c3e50;
            font-size: 14px;

        }
    </style>
</head>
    </head>
    <body>

    <!-- KOTAK JUDUL PETA -->
    <div id="judul-peta">
        Peta Area Rawan Longsor di Provinsi Sumatera Utara
    </div>

        <div id="map">
        </div>
        <script src="js/qgis2web_expressions.js"></script>
        <script src="js/leaflet.js"></script>
        <script src="js/L.Control.Layers.Tree.min.js"></script>
        <script src="js/leaflet.rotatedMarker.js"></script>
        <script src="js/leaflet.pattern.js"></script>
        <script src="js/leaflet-hash.js"></script>
        <script src="js/Autolinker.min.js"></script>
        <script src="js/rbush.min.js"></script>
        <script src="js/labelgun.min.js"></script>
        <script src="js/labels.js"></script>
        <script src="js/leaflet.photon.js"></script>
        <script src="js/leaflet-search.js"></script>
        <script src="data/terakhir_0.js"></script>
        <script>
        var highlightLayer;
        function highlightFeature(e) {
            highlightLayer = e.target;

            if (e.target.feature.geometry.type === 'LineString' || e.target.feature.geometry.type === 'MultiLineString') {
              highlightLayer.setStyle({
                color: 'rgba(255, 255, 0, 1.00)',
              });
            } else {
              highlightLayer.setStyle({
                fillColor: 'rgba(255, 255, 0, 1.00)',
                fillOpacity: 1
              });
            }
            highlightLayer.openPopup();
        }
        var map = L.map('map', {
            zoomControl:false, maxZoom:28, minZoom:1
        })
        // Tambahkan Basemap OSM atau CartoDB
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri',
            maxZoom: 18
        }).addTo(map);
        var hash = new L.Hash(map);
        map.attributionControl.setPrefix('<a href="https://github.com/qgis2web/qgis2web" target="_blank">qgis2web</a> &middot; <a href="https://leafletjs.com" title="A JS library for interactive maps">Leaflet</a> &middot; <a href="https://qgis.org">QGIS</a>');
        var autolinker = new Autolinker({truncate: {length: 30, location: 'smart'}});
        // remove popup's row if "visible-with-data"
        function removeEmptyRowsFromPopupContent(content, feature) {
         var tempDiv = document.createElement('div');
         tempDiv.innerHTML = content;
         var rows = tempDiv.querySelectorAll('tr');
         for (var i = 0; i < rows.length; i++) {
             var td = rows[i].querySelector('td.visible-with-data');
             var key = td ? td.id : '';
             if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                 rows[i].parentNode.removeChild(rows[i]);
             }
         }
         return tempDiv.innerHTML;
        }
        // modify popup if contains media
        function addClassToPopupIfMedia(content, popup) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var imgTd = tempDiv.querySelector('td img');
            if (imgTd) {
                var src = imgTd.getAttribute('src');
                if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
                    popup._contentNode.classList.add('media');
                    var img = popup._contentNode.querySelector('td img');
                    if (img) {
                        // If already loaded (cache), update immediately
                        if (img.complete && img.naturalHeight > 0) {
                            popup.update();
                        } else {
                            img.addEventListener('load', function() {
                                popup.update();
                            });
                            img.addEventListener('error', function() {
                                popup.update();
                            });
                        }
                    }
                } else if (/\.(mp3|wav|ogg|aac)$/i.test(src)) {
                    var audio = document.createElement('audio');
                    audio.controls = true;
                    audio.src = src;
                    imgTd.parentNode.replaceChild(audio, imgTd);
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else if (/\.(mp4|webm|ogg|mov)$/i.test(src)) {
                    var video = document.createElement('video');
                    video.controls = true;
                    video.src = src;
                    video.style.width = "400px";
                    video.style.height = "300px";
                    video.style.maxHeight = "60vh";
                    video.style.maxWidth = "60vw";
                    imgTd.parentNode.replaceChild(video, imgTd);
                    popup._contentNode.classList.add('media');
                    // Aggiorna il popup quando il video carica i metadati
                    video.addEventListener('loadedmetadata', function() {
                        popup.update();
                    });
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else {
                    popup._contentNode.classList.remove('media');
                }
            } else {
                popup._contentNode.classList.remove('media');
            }
        }
        var zoomControl = L.control.zoom({
            position: 'topleft'
        }).addTo(map);
        var bounds_group = new L.featureGroup([]);
        function setBounds() {
            if (bounds_group.getLayers().length) {
                map.fitBounds(bounds_group.getBounds());
            }
        }
        function pop_terakhir_0(feature, layer) {
            layer.on({
                mouseout: function(e) {
                    for (var i in e.target._eventParents) {
                        if (typeof e.target._eventParents[i].resetStyle === 'function') {
                            e.target._eventParents[i].resetStyle(e.target);
                        }
                    }
                    if (typeof layer.closePopup == 'function') {
                        layer.closePopup();
                    } else {
                        layer.eachLayer(function(feature){
                            feature.closePopup()
                        });
                    }
                },
                mouseover: highlightFeature,
            });
            var popupContent = '<table>\
                    <tr>\
                        <th scope="row">Desa/Kelurahan</th>\
                        <td>' + (feature.properties['Desa/Kelur'] !== null ? autolinker.link(String(feature.properties['Desa/Kelur']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">Kecamatan</th>\
                        <td>' + (feature.properties['Kecamatan'] !== null ? autolinker.link(String(feature.properties['Kecamatan']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">Kabupaten/Kota</th>\
                        <td>' + (feature.properties['Kabupaten/'] !== null ? autolinker.link(String(feature.properties['Kabupaten/']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">Provinsi</th>\
                        <td>' + (feature.properties['Provinsi'] !== null ? autolinker.link(String(feature.properties['Provinsi']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">Tingkat Kerawanan</th>\
                        <td>' + (feature.properties['Kerawanan'] !== null ? autolinker.link(String(feature.properties['Kerawanan']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                </table>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
			layer.on('popupopen', function(e) {
				addClassToPopupIfMedia(content, e.popup);
			});
			layer.bindPopup(content, { maxHeight: 400 });
        }

        function style_terakhir_0_0(feature) {
            switch(String(feature.properties['Kerawanan'])) {
                case 'Rendah':
                    return {
                pane: 'pane_terakhir_0',
                opacity: 1,
                color: 'rgba(69,116,40,0.23137254901960785)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 1.0, 
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(184,255,126,1.0)',
                interactive: true,
            }
                    break;
                case 'Tinggi':
                    return {
                pane: 'pane_terakhir_0',
                opacity: 1,
                color: 'rgba(35,35,35,1.0)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 1.0, 
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(227,26,28,1.0)',
                interactive: true,
            }
                    break;
                default:
                    return {
                pane: 'pane_terakhir_0',
                opacity: 1,
                color: 'rgba(35,35,35,1.0)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 1.0, 
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(184,213,129,1.0)',
                interactive: true,
            }
                    break;
            }
        }
        map.createPane('pane_terakhir_0');
        map.getPane('pane_terakhir_0').style.zIndex = 400;
        map.getPane('pane_terakhir_0').style['mix-blend-mode'] = 'normal';
        var layer_terakhir_0 = new L.geoJson(json_terakhir_0, {
            attribution: '',
            interactive: true,
            dataVar: 'json_terakhir_0',
            layerName: 'layer_terakhir_0',
            pane: 'pane_terakhir_0',
            onEachFeature: pop_terakhir_0,
            style: style_terakhir_0_0,
        });
        bounds_group.addLayer(layer_terakhir_0);
        map.addLayer(layer_terakhir_0);
        setBounds();

        // Loop untuk membuat kolom teks pencarian gabungan di setiap poligon
        layer_terakhir_0.eachLayer(function(l) {
            if (l.feature && l.feature.properties) {
                var p = l.feature.properties;
                var desa = p['Desa/Kelur'];
                var kec  = p['Kecamatan'];
                var kab  = p['Kabupaten/'];

                // Format tampilan di dropdown search: "Nama Desa, Kec. Nama Kec, Kab. Nama Kab"
                l.feature.properties['search_text'] = desa + ', Kec. ' + kec + ', ' + kab;
            }
        });

        map.addControl(new L.Control.Search({
                    layer: layer_terakhir_0,
                    initial: false,
                    hideMarkerOnCollapse: true,
                    propertyName: 'search_text', // Menggunakan teks gabungan tadi
                    textPlaceholder: 'Cari Desa, Kecamatan, atau Kabupaten...',
                    zoom: 13,
                    animateLocation: true,
                    autoCollapse: false,
                    collapsed:false,
                    autoType: false,
                    marker: {
                        icon: false,
                        animate: true,
                        circle: {
                            radius: 30,
                            weight: 3,
                            color: '#e74c3c',
                            stroke: true,
                            fill: false
                        }
                    },
           moveToLocation: function(latlng, title, map) {
              // Reset warna seluruh poligon terlebih dahulu
                if (typeof resetLabels === 'function') resetLabels([layer_terakhir_0]);

                if (latlng.layer && latlng.layer.getBounds) {
                    // Zoom pas ke poligon desa yang dipilih
                    map.fitBounds(latlng.layer.getBounds(), { maxZoom: 15 });

                    // Beri highlight pada desa tersebut
                    latlng.layer.setStyle({
                        color: '#ffff00',
                        weight: 4,
                        fillOpacity: 0.7
                    });
                    
                    // Perbarui kotak detail wilayah secara otomatis
                    if (typeof info !== 'undefined') {
                        info.update(latlng.layer.feature.properties);
                    }
                }
            }
        }));
        if (typeof url === 'undefined') {
            document.getElementsByClassName('search-button')[0].className += ' fa fa-binoculars';
        } else {
            document.getElementsByClassName('search-button')[1].className += ' fa fa-binoculars';
        }
        var legend = L.control({position: 'bottomright'});
        legend.onAdd = function (map) {
            var div = L.DomUtil.create('div', 'info legend');
            div.innerHTML += '<b>Tingkat Kerawanan</b><br>';
            div.innerHTML += '<i style="background: #ff0000"></i> Tinggi<br>';
            div.innerHTML += '<i style="background: #ffff00"></i> Sedang<br>';
            div.innerHTML += '<i style="background: #90ee90"></i> Rendah<br>';
            return div;
        };
        legend.addTo(map);
        L.control.scale({metric: true, imperial: false, position: 'bottomleft'}).addTo(map);
    var info = L.control({position: 'topleft'});
    info.onAdd = function (map) {
        this._div = L.DomUtil.create('div', 'info-box');
        this.update();
        return this._div;
    };
    info.update = function (props) {
        this._div.innerHTML = '<h4>Detail Wilayah</h4>' +  (props ?
            '<b>' + (props['desa'] || props['Desa/Kel'] || 'Wilayah') + '</b><br />' +
            'Kecamatan: ' + (props['Kecamatan'] || '-') + '<br />' +
            'Kerawanan: <b>' + (props['tk_resiko'] || '-') + '</b>'
            : 'Arahkan kursor ke wilayah administrasi pada peta untuk menampilkan informasi lebih detail atau gunakan tombol pencarian di atas');
    };
    info.addTo(map);
        // Memaksa peta langsung nge-zoom pas memenuhi layar sesuai batas layer Anda
    map.fitBounds(layer_terakhir_0.getBounds(), {
        padding: [30, 30] // Memberi jarak tepi 30px agar tidak mepet ke pinggir layar
    });
        map.setZoom(map.getZoom() + 1); // Otomatis mendekat 1 level zoom lebih dekat
     </script>        
    </body>

</html>
